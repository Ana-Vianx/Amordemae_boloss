<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amor de Mãe Bolos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cardapio">
    <header class="cabecalho">
        <a href="inicial.html"><img src="./images/home.png"></a>
        <p>bolos ° sobremesas ° bolachas ° pudins</p>
    </header>
    <main>
        <section class="catalogo">

        <!-- Botões -->
        <div class="categorias">
            <button class="tab active" data-tab="caseirinhos">Caseirinhos</button>
            <button class="tab" data-tab="decorados">Decorados</button>
            <button class="tab" data-tab="bolachas">Bolachas</button>
            <button class="tab" data-tab="sobremesas">Sobremesas</button>
        </div>

        <!-- Produtos Caseirinhos -->
        <div class="conteudo active" id="caseirinhos">
            <div class="card">
                <img src="./images/cenoura.jpg" alt="">
                <h3>Cenoura</h3>
                <p>R$48,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
            <div class="card">
                <img src="./images/fuba.jpg" alt="">
                <h3>Fubá</h3>
                <p>R$42,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
            <div class="card">
                <img src="./images/pacoca.jpg" alt="">
                <h3>Paçoca</h3>
                <p>R$42,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
        </div>

        <!-- Produtos Decorados -->
        <div class="conteudo" id="decorados">
            <div class="card">
                <img src="./images/decorado_chocolate.jpg" alt="">
                <h3>Chocolate</h3>
                <p>R$95,00</p>
                <button>Adicionar ao carrinho</button>
            </div>

            <div class="card">
                <img src="./images/decorado_morango.jpg" alt="">
                <h3>Morango</h3>
                <p>R$110,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
            <div class="card">
                <img src="./images/decorado_maracuja.png" alt="">
                <h3>Maracujá</h3>
                <p>R$110,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
        </div>

        <!-- Produtos Bolachas -->
        <div class="conteudo" id="bolachas">
            <div class="card">
                <img src="./images/bolachas_amantegadas.jpg" alt="">
                <h3>Amanteigadas</h3>
                <p>R$20,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
        </div>

        <!-- Produtos Sobremesas -->
        <div class="conteudo" id="sobremesas">
            <div class="card">
                <img src="./images/pudim.jpg" alt="">
                <h3>Pudim</h3>
                <p>R$35,00</p>
                <button>Adicionar ao carrinho</button>
            </div>
        </div>

    </section>
    </main>
    <footer class="rodape">
        <p>Desenvolvido por Ana Viana. 2026</p>
    </footer>
</body>
<script src="script.js"></script>
</html>
