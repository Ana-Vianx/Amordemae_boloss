<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tela_login">
    <div class="logo_login">
        <img src="./images/logo.png" alt="">
    </div>
    <div class="login-box">
        <h2 class="titulo_login">Login</h2>
        <form class="titulo_input">
            <p>E-mail</p>
            <input type="email" placeholder="" required>
            <p>Senha</p>
            <input type="password" placeholder="" required>
            <button class="botao_login" type="submit" href="inicial.html">Entrar</button>
            <a href="fazer_conta.html" class="link_conta_nova">Não tem uma conta? Criar uma</a>
        </form>
    </div>
    <footer>
        <p>Desenvolvido por Ana Viana. 2026</p>
    </footer>
</body>
</html>
